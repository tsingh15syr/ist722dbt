version: 2
models:
  - name: obt_sales
    description: >-
      Sales one big table joining fact_sales with customer, employee, date,
      product, and supplier attributes. One row per product on an order.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [orderid, productkey]
    columns:
      - name: orderid
        description: Source order identifier.
      - name: productkey
        description: Product key; with orderid defines the row grain.
      - name: soldamount
        description: Net sale amount per order line after discount.
